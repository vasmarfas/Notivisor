name: Announce

on:
  release:
    types: [published]

jobs:
  telegram:
    name: Telegram
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Post to the project chat
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
        run: |
          set -eu
          {
            printf '## Notivisor %s\n\n%b\n\n' "$TAG" "$NOTES"
            printf '[Скачать / Download](https://github.com/%s/releases/tag/%s)\n' "$GITHUB_REPOSITORY" "$TAG"
          } > message.md
          jq -n --rawfile markdown message.md '{chat_id: "@vasmarfas_chat", message_thread_id: 17, rich_message: {markdown: $markdown}}' \
            | curl -fsS "https://api.telegram.org/bot$TG_BOT_TOKEN/sendRichMessage" -H 'Content-Type: application/json' -d @- > /dev/null
